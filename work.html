<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Work | Elias</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Basic Styling for the Work Page */
        .work-section { padding: 100px 10%; text-align: center; }
        .gallery { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
        .work-item { cursor: pointer; border-radius: 10px; overflow: hidden; width: 250px; transition: 0.3s; }
        .work-item:hover { transform: scale(1.05); }
        .work-item img { width: 100%; display: block; }

        /* Modal (Popup) Styling */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        
        /* FIX: Centering the content better and ensuring black text inside the modal */
        .modal-content { 
            color: #333; /* Ensures text inside is readable */
            position: relative; 
            margin: auto; 
            top: 10%; 
            width: 80%; 
            max-width: 700px; 
            background: #fff; 
            padding: 30px; /* Increased padding */
            border-radius: 10px; 
            text-align: center;
        }
        
        .close-btn { position: absolute; top: 10px; right: 20px; font-size: 30px; cursor: pointer; color: #333;}
        .close-btn:hover { color: red; }
    </style>
</head>
<body>

<header>
    <h2 class="logo">ELIAS</h2>
    <ul class="nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="work.html" class="active">My Work</a></li> 
    </ul>
</header>

<section class="work-section">
    <h1>My Projects & Designs</h1>
    <p>Click a project to see more details.</p>

    <div class="gallery">
        
        <div class="work-item" onclick="openPopup('image/kagitingan.png', 'Araw ng Kagitingan - April 09, 2026')">
            <img src="image/kagitingan.png" alt="Araw ng Kagitingan Design">
            <h3>Pubmat Design</h3>
        </div>
        
        <div class="work-item" onclick="openPopup('image/laborday.png', 'Labor Day Tribute - May 1, 2026')">
            <img src="image/laborday.png" alt="Labor Day Design">
            <h3>Pubmat Design</h3>
        </div>

        <div class="work-item" onclick="openPopup('image/Maundy.png', 'Maundy Thursday - April 2, 2026')">
            <img src="image/Maundy.png" alt="Maundy Thursday Design">
            <h3>Pubmat Design</h3>
        </div>

        <div class="work-item" onclick="openPopup('image/manuelroxas.png', 'Manuel Roxas Death Anniversary Tribute')">
            <img src="image/manuelroxas.png" alt="Manuel Roxas Design">
            <h3>Pubmat Design</h3>
        </div> 
        
        <div class="work-item" onclick="openPopup('image/Indepence.png', 'Independence Day - June 12, 2026')">
            <img src="image/Indepence.png" alt="Manuel Roxas Design">
            <h3>Pubmat Design</h3>
        </div> 

        <div class="work-item" onclick="openPopup('image/Mothersday.png', 'Mother\'s Day - May 10, 2026')">
            <img src="image/Mothersday.png" alt="Manuel Roxas Design">
            <h3>Pubmat Design</h3>
        </div> 
        
    </div>
</section>

<div id="workModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closePopup()">&times;</span>
        <h2 id="modalTitle">Project Name</h2>
        <img id="modalImg" src="" alt="Full View" style="width: 100%; border-radius: 5px; margin-top: 15px;">
    </div>
</div>

<script>
    function openPopup(imgSrc, title) {
        // This function now receives the correct path (e.g., 'image/kagitingan.png')
        document.getElementById("modalImg").src = imgSrc;
        document.getElementById("modalTitle").innerHTML = title;
        document.getElementById("workModal").style.display = "block";
    }

    function closePopup() {
        document.getElementById("workModal").style.display = "none";
    }

    // Close modal if user clicks outside the modal-content box
    window.onclick = function(event) {
        let modal = document.getElementById("workModal");
        if (event.target == modal) { modal.style.display = "none"; }
    }
</script>

</body>
</html>
